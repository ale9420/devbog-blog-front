<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BogDev — Aviso de privacidad</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bogdev/tokens.css">
<link rel="stylesheet" href="ds/bogdev/components/bundle.css">
<script src="ds/bogdev/components/bundle.js"></script>
<link rel="stylesheet" href="/_blob/5fb739953cd44fa7857304c01a34bd49">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:transparent}
.bd-aviso{font-family:"Archivo","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--surface-raised);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.28)}
.bd-aviso a{color:var(--link);text-underline-offset:3px}
.bd-aviso a:hover{color:var(--ink)}
.bd-aviso-ok{min-height:40px;padding:0 16px;background:var(--ink);color:var(--on-ink);border:0;border-radius:0;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.bd-aviso-ok:hover{background:var(--ink-muted)}
@media (prefers-reduced-motion: no-preference){.bd-aviso{animation:bd-aviso-in 360ms cubic-bezier(.2,0,0,1) both}}
@keyframes bd-aviso-in{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 100%; background: transparent">
<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<section class="bd-aviso" role="region" aria-label="Aviso de privacidad" style="width: 100%; display: flex; flex-direction: {{dir}}; align-items: {{align}}; gap: 16px; padding: {{pad}}">
<p style="margin: 0; flex-grow: 1; font-size: 14px; line-height: 22px; color: var(--ink-muted)"><span class="bd-mono" aria-hidden="true" style="color: var(--chillon)">◆ </span>Sin cookies de seguimiento. Contamos visitas de forma anónima con Umami. <a href="{{privHref}}">Más información</a></p>
<button type="button" class="bd-aviso-ok" onClick="{{close}}" style="flex: none; align-self: {{btnAlign}}">Entendido</button>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["noche","dia"],"default":"noche","section":"Tema"},"movil":{"editor":"boolean","default":false,"section":"Variante"},"onClose":{"editor":null},"$preview":{"width":440,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const t = p.tema || 'noche';
    const m = p.movil === true || p.movil === 'true';
    return {
      themeClass: 'bd-root ' + (t === 'dia' ? 'bd-dia' : 'bd-noche'),
      open: !s.closed,
      dir: m ? 'column' : 'row',
      align: m ? 'stretch' : 'center',
      btnAlign: m ? 'flex-end' : 'center',
      pad: m ? '16px' : '14px 14px 14px 18px',
      privHref: m ? 'PrivacidadMovil.dc.html' : 'Privacidad.dc.html',
      close: () => { this.setState({ closed: true }); if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
