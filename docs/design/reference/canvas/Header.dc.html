<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BogDev — Header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bogdev/tokens.css">
<link rel="stylesheet" href="ds/bogdev/components/bundle.css">
<script src="ds/bogdev/components/bundle.js"></script>
<link rel="stylesheet" href="/_blob/5fb739953cd44fa7857304c01a34bd49">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bd-root {{themeClass}}" style="width: 100%; display: flex; flex-direction: column; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: var(--ink); background: var(--surface); --logo-agua: {{logoAgua}}; --logo-ladrillo: {{logoLadrillo}}">
<sc-if value="{{desk}}" hint-placeholder-val="{{true}}">
<div style="position: relative; z-index: 10">
<x-import component-from-global-scope="BogDev.NavBar" links="{{navLinks}}" lang="{{lang}}" on-lang-change="{{setLang}}" home-href="Main.dc.html"></x-import>
</div>
<sc-if value="{{sitio}}" hint-placeholder-val="{{true}}">
<div style="position: relative; z-index: 10; height: 64px; padding: 0 120px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line)">
<div class="bd-meta" style="display: flex; gap: 16px; align-items: center; color: var(--ink-muted)">
<span style="color: var(--chillon)">◆</span><span>BOGOTÁ</span><span>4.61°N 74.08°W</span><span>2.640 M S.N.M.</span>
</div>
<div style="display: flex; gap: 12px; align-items: center">
<a href="Main.dc.html#fediverso" class="bd-chip" style="text-decoration: none; color: var(--ink-muted)"><span style="color: var(--chillon)">◆</span> @devbog</a>
<button type="button" class="bd-chip" onClick="{{search}}" aria-haspopup="dialog">Buscar <span class="bd-kbd">⌘K</span></button>
<div role="group" aria-label="Tema de color" style="display: flex; border: 1px solid var(--line-strong)">
<button type="button" class="bd-seg" aria-pressed="{{isNoche}}" onClick="{{toNoche}}">Noche</button>
<button type="button" class="bd-seg" aria-pressed="{{isDia}}" onClick="{{toDia}}">Día</button>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{lee}}" hint-placeholder-val="{{false}}">
<div style="position: relative; z-index: 9; height: 64px; padding: 0 120px; display: flex; align-items: center; justify-content: space-between; gap: 32px; border-bottom: 1px solid var(--line)">
<div class="bd-progress" aria-hidden="true" style="position: absolute; left: 0; bottom: -1px; height: 2px; width: {{progresoPct}}; background: var(--chillon)"></div>
<div class="bd-progress-bird" aria-hidden="true" style="position: absolute; left: {{progresoPct}}; bottom: 4px; width: 22px; margin-left: -11px; color: var(--chillon)"><div style="position: relative"><svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path class="bd-wing" d="M1 9 Q6 1 11 8 Q16 1 21 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div>
<div class="bd-meta" style="display: flex; gap: 16px; color: var(--ink-muted)"><a class="bd-link" href="Main.dc.html">INICIO</a><span>/</span><a class="bd-link" href="Blog.dc.html">BLOG</a><span>/</span><span style="color: var(--ink)">{{seccion}}</span></div>
<div style="display: flex; align-items: center; gap: 16px">
<span class="bd-meta" style="color: var(--ink-muted)">LEÍDO {{progresoLabel}}</span>
<div role="group" aria-label="Tema de color" style="display: flex; border: 1px solid var(--line-strong)">
<button type="button" class="bd-seg" aria-pressed="{{isNoche}}" onClick="{{toNoche}}">Noche</button>
<button type="button" class="bd-seg" aria-pressed="{{isDia}}" onClick="{{toDia}}">Día</button>
</div>
</div>
</div>
</sc-if>
</sc-if>
<sc-if value="{{mob}}" hint-placeholder-val="{{false}}">
<header style="height: 64px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--line)">
<a href="Movil.dc.html" aria-label="BogDev, inicio" class="bd-wide" style="display: inline-flex; align-items: center; gap: 10px; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; text-decoration: none; color: var(--ink)"><x-import component-from-global-scope="BogDev.Logo" size="{{logoS}}"></x-import><span>Bog<span style="color: var(--mirla)">Dev</span></span></a>
<div style="display: flex; align-items: center">
<button type="button" class="bd-iconbtn" aria-label="Buscar" aria-haspopup="dialog" onClick="{{search}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" style="display: block"><circle cx="11" cy="11" r="6"></circle><path d="M15.5 15.5 L20 20"></path></svg></button>
<button type="button" class="bd-iconbtn" aria-label="Abrir menú" aria-haspopup="dialog" aria-expanded="{{menuOpen}}" onClick="{{menu}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" style="display: block"><path d="M4 7 H20 M4 12 H20 M4 17 H20"></path></svg></button>
</div>
</header>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema": {"editor": "enum", "options": ["noche", "dia"], "default": "noche", "section": "Tema"}, "movil": {"editor": "boolean", "default": false, "section": "Variante"}, "activa": {"editor": "enum", "options": ["inicio", "blog", "acerca", "ninguna"], "default": "inicio", "section": "Variante"}, "lectura": {"editor": "boolean", "default": false, "section": "Variante"}, "progreso": {"editor": "range", "min": 0, "max": 100, "step": 1, "default": 38, "section": "Variante"}, "seccion": {"editor": null, "default": "IA"}, "lang": {"editor": null}, "menuOpen": {"editor": null}, "onSearch": {"editor": null}, "onMenu": {"editor": null}, "onNoche": {"editor": null}, "onDia": {"editor": null}, "onLang": {"editor": null}, "$preview": {"width": 1440, "height": 136}}'>
class Component extends DCLogic {
  call(name, arg) { const f = this.props[name]; if (typeof f === 'function') { f(arg); return true; } return false; }
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const t = s.tema || p.tema || 'noche';
    const m = p.movil === true || p.movil === 'true';
    const lee = p.lectura === true || p.lectura === 'true';
    const act = p.activa || (lee ? 'blog' : 'inicio');
    const pr = Math.max(0, Math.min(100, Number(p.progreso ?? 38)));
    const lang = p.lang || s.lang || 'es';
    return {
      themeClass: t === 'dia' ? 'bd-dia' : 'bd-noche',
      logoAgua: t === 'dia' ? '#0D6B6F' : '#ffffff',
      logoLadrillo: t === 'dia' ? '#D4743F' : '#ffffff',
      desk: !m, mob: m, sitio: !lee, lee: lee,
      navLinks: [
        { label: 'Inicio', href: 'Main.dc.html', active: act === 'inicio' },
        { label: 'Blog', href: 'Blog.dc.html', active: act === 'blog' },
        { label: 'Acerca de', href: 'Acerca.dc.html', active: act === 'acerca' }
      ],
      lang: lang,
      setLang: (l) => { if (!this.call('onLang', l)) this.setState({ lang: l }); },
      isNoche: t !== 'dia', isDia: t === 'dia',
      toNoche: (e) => { if (!this.call('onNoche', e)) this.setState({ tema: 'noche' }); },
      toDia: (e) => { if (!this.call('onDia', e)) this.setState({ tema: 'dia' }); },
      search: (e) => { this.call('onSearch', e); },
      menu: (e) => { this.call('onMenu', e); },
      menuOpen: !!p.menuOpen,
      progresoPct: pr + '%',
      progresoLabel: pr + ' %',
      seccion: p.seccion || 'IA',
      logoS: 28
    };
  }
}
</script>
</body>
</html>
