<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BogDev — Borrador de artículo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bogdev/tokens.css">
<link rel="stylesheet" href="ds/bogdev/components/bundle.css">
<script src="ds/bogdev/components/bundle.js"></script>
<link rel="stylesheet" href="/_blob/5fb739953cd44fa7857304c01a34bd49">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#0a0c10}</style>
</helmet>
<div style="width: 1440px; height: 6300px; overflow: hidden">
<dc-import name="Articulo" borrador="{{yes}}" tema="{{tema}}" hint-size="1440px,6300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["noche","dia"],"default":"noche","section":"Tema"},"$preview":{"width":1440,"height":6300}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, tema: this.props.tema || 'noche' };
  }
}
</script>
</body>
</html>
